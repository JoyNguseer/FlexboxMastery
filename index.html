<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Dashboard Sandbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- THE NAV BAR PARENT -->
     <nav class="navbar">
        
        <!-- Left Side Logo -->
         <div class="logo">DevDash</div>
         
        <!-- Right Side: Navigation Links Parent-->
        <div class="nav-links">
            <!-- Navigation Links Children -->
            <a href="#">Home</a>
            <a href="#">Analytics</a>
            <a href="#">Settings</a>
        </div>
    </nav>
    <h1>My Advanced Layout Playground</h1><!-- This is the PARENT container -->
    <div class="dashboard-container">

        <!-- These are the CHILDREN blocks -->
        <div class="card card-1"><h3>Analytics</h3><p>Data goes here.</p></div>
        <div class="card card-2"><h3>Users</h3><p>User stats here.</p></div>
        <div class="card card-3"><h3>Settings</h3><p>Config panel here.</p></div>
    </div>
</body>
</html>
